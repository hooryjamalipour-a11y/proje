<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>رستم و سیمرغ | نسخه ۵.۱.۰</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#wrap{position:fixed;inset:0;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#camera{display:none}#character{display:none}
#controls{position:absolute;z-index:5;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);padding:13px;background:rgba(0,0,0,.72);border:1px solid #ffffff2b;border-radius:15px;backdrop-filter:blur(8px)}
h1{font-size:17px;margin:0 0 6px}p{font-size:12px;line-height:1.6;color:#e5e5e5;margin:0 0 10px}
button{width:100%;border:0;border-radius:11px;background:#e9b65b;color:#16120a;font-weight:800;font-size:15px;padding:12px}
#status{font-size:12px;color:#ddd;margin-top:8px;line-height:1.5}
#hide{position:absolute;z-index:6;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:auto;padding:9px 12px;background:#222;color:#fff;border:1px solid #ffffff44}
body.running #controls{background:rgba(0,0,0,.5);padding:9px 12px}
body.running h1{font-size:13px;margin:0}
body.running p{display:none}body.running #status{margin-top:4px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="out"></canvas>
<video id="camera" playsinline muted autoplay></video>
<video id="character" src="./character-green-screen.mp4" playsinline preload="auto" crossorigin="anonymous"></video>
<audio id="voice" src="./rostam-voice.mp3" preload="auto"></audio>
<div id="controls">
<h1>رستم و سیمرغ | نسخه ۵.۱.۰</h1>
<p>با شروع، دوربین و ویدیو فعال می‌شوند. رستم در مرکز قاب و با اندازه بزرگ نمایش داده می‌شود؛ برای حذف کروماکی و شنیدن صدا، شروع را بزنید.</p>
<button id="start">شروع دوربین و پخش</button>
<div id="status">برای اجرا، مجوز دوربین را تأیید کنید.</div>
</div>
<button id="hide" hidden>نمایش کنترل‌ها</button>
</div>
<script>
const canvas=document.getElementById('out'),ctx=canvas.getContext('2d',{alpha:false});
const camera=document.getElementById('camera'),character=document.getElementById('character'),voice=document.getElementById('voice');
const start=document.getElementById('start'),status=document.getElementById('status'),controls=document.getElementById('controls'),hide=document.getElementById('hide');
let stream=null,raf=0,runStart=0,active=false,showUI=true,lastW=0,lastH=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fitCanvas(){const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(w!==lastW||h!==lastH){lastW=w;lastH=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}}
function drawCover(video,w,h){const vw=video.videoWidth||w,vh=video.videoHeight||h,s=Math.max(w/vw,h/vh),dw=vw*s,dh=vh*s;ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh)}
function drawKeyedCharacter(w,h,elapsed){
 if(character.readyState<2||!character.videoWidth)return;
 const vw=character.videoWidth,vh=character.videoHeight;
 // Keep the character large and centered, with a small entry/exit scale animation.
 let scale;
 if(elapsed<2){const t=clamp(elapsed/2,0,1);scale=.25+.75*(t*t*(3-2*t))}
 else if(elapsed<39)scale=1;
 else if(elapsed<41)scale=1-clamp((elapsed-39)/2,0,1);
 else return;
 const targetW=Math.min(w*.88, h*1.08);
 const dw=targetW*scale,dh=dw*vh/vw;
 // Process video frame in an offscreen canvas and remove bright green.
 if(!drawKeyedCharacter.tmp){drawKeyedCharacter.tmp=document.createElement('canvas');drawKeyedCharacter.tctx=drawKeyedCharacter.tmp.getContext('2d',{willReadFrequently:true})}
 const tmp=drawKeyedCharacter.tmp,tctx=drawKeyedCharacter.tctx;
 if(tmp.width!==vw||tmp.height!==vh){tmp.width=vw;tmp.height=vh}
 tctx.drawImage(character,0,0,vw,vh);
 let img;
 try{img=tctx.getImageData(0,0,vw,vh)}catch(e){return}
 const d=img.data;
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2];
  // Green-screen key: suppress vivid green; feather edge to avoid a hard outline.
  const dominance=g-Math.max(r,b);
  const green=Math.max(0,Math.min(1,(dominance-18)/65))*Math.max(0,Math.min(1,(g-65)/95));
  if(green>.88)d[i+3]=0;
  else if(green>.12)d[i+3]=Math.round(d[i+3]*(1-green));
  if(d[i+3]>0 && dominance>12){d[i+1]=Math.min(g,Math.max(r,b)+Math.round((g-Math.max(r,b))*(1-green)*.25))}
 }
 tctx.putImageData(img,0,0);
 ctx.drawImage(tmp,(w-dw)/2,(h-dh)/2,dw,dh);
}
function loop(){
 fitCanvas();const w=innerWidth,h=innerHeight;
 if(camera.readyState>=2)drawCover(camera,w,h);else{ctx.fillStyle='#080808';ctx.fillRect(0,0,w,h)}
 if(active){const elapsed=(performance.now()-runStart)/1000;drawKeyedCharacter(w,h,elapsed);
  if(elapsed>=41){active=false;character.pause();voice.pause();status.textContent='اجرا تمام شد. برای شروع دوباره دکمه را بزنید.';start.disabled=false;start.textContent='شروع دوباره';document.body.classList.remove('running')}
 }
 raf=requestAnimationFrame(loop)
}
async function begin(){
 start.disabled=true;status.textContent='در حال باز کردن دوربین…';
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('دوربین در این مرورگر در دسترس نیست؛ لینک باید HTTPS باشد.');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  camera.srcObject=stream;await camera.play();
  character.pause();character.currentTime=0;
  await character.play();
  voice.pause();voice.currentTime=0;
  // The gesture starts both media tracks together; muted video avoids duplicate/green-screen audio.
  const audioPromise=voice.play();
  if(audioPromise)audioPromise.catch(()=>{status.textContent='تصویر اجرا شد؛ برای پخش صدا، صدای گوشی را بررسی و دوباره شروع کنید.'});
  runStart=performance.now();active=true;
  document.body.classList.add('running');hide.hidden=false;start.textContent='در حال پخش…';
  status.textContent='در حال پخش: ورود ۲ ثانیه · مکث ۳۷ ثانیه · خروج ۲ ثانیه';
 }catch(e){console.error(e);status.textContent='خطا: '+(e.message||e)+' اگر مجوز دوربین را نداده‌اید، اجازه دهید و دوباره بزنید.';start.disabled=false}
}
start.addEventListener('click',begin);
hide.addEventListener('click',()=>{showUI=!showUI;controls.style.display=showUI?'block':'none';hide.textContent=showUI?'پنهان‌کردن کنترل‌ها':'نمایش کنترل‌ها'});
addEventListener('resize',fitCanvas);
character.addEventListener('error',()=>{status.textContent='فایل character-green-screen.mp4 پیدا نشد؛ آن را کنار index.html در GitHub بگذارید.'});
voice.addEventListener('error',()=>{status.textContent='فایل rostam-voice.mp3 پیدا نشد؛ آن را کنار index.html در GitHub بگذارید.'});
fitCanvas();loop();
</script>
</body>
</html>
